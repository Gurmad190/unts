name: Import verified YouWare source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Import the verified archive once
        shell: bash
        run: |
          set -euo pipefail
          test ! -f src/main.tsx
          curl --fail --location --silent --show-error --retry 2 'https://raw.githubusercontent.com/Gurmad190/Units/1fca99bc9f01aa38a25a0fc6e3bf0a5951d86fc1/source_code.zip' -o "$RUNNER_TEMP/source.zip"
          echo "a473bd5bf03a50b1ab2622f5eb6352fce29f4499969ba81d55fc08ce350350c5  $RUNNER_TEMP/source.zip" | sha256sum --check
          mkdir "$RUNNER_TEMP/import"
          unzip -q "$RUNNER_TEMP/source.zip" -d "$RUNNER_TEMP/import"
          rsync -a --exclude='dist/' "$RUNNER_TEMP/import/" ./
          jq '.packageManager = "pnpm@10.28.0"' package.json > "$RUNNER_TEMP/package.json"
          mv "$RUNNER_TEMP/package.json" package.json
          test -f src/main.tsx
          test -f public/uns-logo.jpg
          test -f public/aigc-images/uns-hero-campus_1788020145_000.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit --author='Gurmad190 <252935841+Gurmad190@users.noreply.github.com>' -m 'Import complete YouWare source and assets; pin pnpm version'
          git push origin HEAD:main
